{% extends 'layout.html' %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Profile</h1>
</div>

<div class="p-6 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
    <div class="flex flex-col items-center pb-10">
        <div class="w-24 h-24 mb-3 rounded-full shadow-lg bg-blue-500 flex items-center justify-center text-white text-4xl font-bold">
            {{ user.full_name[0] | upper }}
        </div>
        <h5 class="mb-1 text-xl font-medium text-gray-900 dark:text-white">{{ user.full_name }}</h5>
        <span class="text-sm text-gray-500 dark:text-gray-400">{{ user.role | capitalize }}</span>

        <div class="w-full mt-6 space-y-4">
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg dark:bg-gray-700">
                <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Email</span>
                <span class="text-sm text-gray-900 dark:text-white">{{ user.email }}</span>
            </div>
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg dark:bg-gray-700">
                <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Status</span>
                <span class="text-sm text-green-600 font-semibold">Active</span>
            </div>
        </div>

        <div class="flex mt-6 space-x-3">
            <a href="/logout" class="inline-flex items-center px-4 py-2 text-sm font-medium text-center text-white bg-red-700 rounded-lg hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-800">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
