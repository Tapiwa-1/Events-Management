{% extends 'layout.html' %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Marketing</h1>
</div>

<div class="space-y-4">
    {% for inquiry in inquiries %}
    <div class="p-4 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white">{{ inquiry.name }}</h3>
            <span class="px-2 py-1 text-xs font-semibold text-gray-800 bg-gray-100 dark:bg-gray-700 dark:text-gray-300 rounded-full">
                {{ inquiry.status }}
            </span>
        </div>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">{{ inquiry.message }}</p>
        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
            <span>{{ inquiry.phone }}</span>
            <span>{{ inquiry.date }}</span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
