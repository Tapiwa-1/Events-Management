{% extends 'layout.html' %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Events</h1>
    <a href="/events/create" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">
        New Event
    </a>
</div>

<div class="space-y-4">
    {% for event in events %}
    <div class="p-4 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white">{{ event.name }}</h3>
            <span class="px-2 py-1 text-xs font-semibold {% if event.status == 'completed' %}text-green-800 bg-green-100 dark:bg-green-900 dark:text-green-300{% else %}text-blue-800 bg-blue-100 dark:bg-blue-900 dark:text-blue-300{% endif %} rounded-full">
                {{ event.status }}
            </span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-sm text-gray-500 dark:text-gray-400">
            <div>
                <span class="font-semibold">Date:</span> {{ event.date }}
            </div>
            <div>
                <span class="font-semibold">Client:</span> {{ event.client_name }}
            </div>
            <div class="col-span-2">
                <span class="font-semibold">Location:</span> {{ event.location or 'N/A' }}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
