{% extends 'layout.html' %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Inventory</h1>
</div>

<div class="space-y-4">
    {% for item in items %}
    <div class="p-4 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white">{{ item.name }}</h3>
            <span class="px-2 py-1 text-xs font-semibold text-gray-800 bg-gray-100 dark:bg-gray-700 dark:text-gray-300 rounded-full">
                {{ item.type }}
            </span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-sm text-gray-500 dark:text-gray-400 mb-4">
            <div>
                <span class="font-semibold">Quantity:</span> {{ item.total_quantity }}
            </div>
            <div>
                <span class="font-semibold">Condition:</span> {{ item.condition }}
            </div>
            <div class="col-span-2">
                <span class="font-semibold">Location:</span> {{ item.location }}
            </div>
        </div>

        <button data-modal-target="update-modal-{{ item.id }}" data-modal-toggle="update-modal-{{ item.id }}" class="w-full text-blue-700 hover:text-white border border-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:border-blue-500 dark:text-blue-500 dark:hover:text-white dark:hover:bg-blue-500 dark:focus:ring-blue-800" type="button">
            Update Stock
        </button>

        <!-- Update Modal -->
        <div id="update-modal-{{ item.id }}" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative p-4 w-full max-w-md max-h-full">
                <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
                    <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Update {{ item.name }}</h3>
                        <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="update-modal-{{ item.id }}">
                            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                            </svg>
                        </button>
                    </div>
                    <form action="/inventory/update/{{ item.id }}" method="POST" class="p-4 md:p-5">
                        <div class="grid gap-4 mb-4 grid-cols-2">
                            <div class="col-span-2">
                                <label for="quantity-{{ item.id }}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">New Quantity</label>
                                <input type="number" name="quantity" id="quantity-{{ item.id }}" value="{{ item.total_quantity }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required="">
                            </div>
                            <div class="col-span-2">
                                <label for="condition-{{ item.id }}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Condition</label>
                                <select name="condition" id="condition-{{ item.id }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                                    <option value="Good" {% if item.condition == 'Good' %}selected{% endif %}>Good</option>
                                    <option value="Fair" {% if item.condition == 'Fair' %}selected{% endif %}>Fair</option>
                                    <option value="Poor" {% if item.condition == 'Poor' %}selected{% endif %}>Poor</option>
                                    <option value="New" {% if item.condition == 'New' %}selected{% endif %}>New</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                            Save Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
