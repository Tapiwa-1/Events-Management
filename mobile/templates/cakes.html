{% extends 'layout.html' %}

{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Cake Orders</h1>
</div>

<div class="space-y-4">
    {% for order in orders %}
    <div class="p-4 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white">{{ order.flavor }}</h3>
            <span class="px-2 py-1 text-xs font-semibold text-blue-800 bg-blue-100 dark:bg-blue-900 dark:text-blue-300 rounded-full">
                {{ order.status }}
            </span>
        </div>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">{{ order.design_notes }}</p>
        <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
            <span>Due: {{ order.due_date }}</span>
            <span>Event ID: {{ order.event_id }}</span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
